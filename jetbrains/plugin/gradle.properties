# The plugin carries no code, so its version is independent of the VSIX.
pluginVersion = 1.0.0

# 2023.1 is the oldest platform with the theme metadata this plugin uses. The
# upper bound is left open: a theme has no API surface to break.
pluginSinceBuild = 231
platformVersion = 2024.3.5

org.gradle.jvmargs = -Xmx2g
org.gradle.caching = true
kotlin.stdlib.default.dependency = false
