name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build and validate VSIX packages
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Run release automation tests
        shell: pwsh
        run: ./scripts/Test.ps1

      - name: Build release artifacts
        shell: pwsh
        run: ./scripts/Build-Release.ps1

      - name: Upload validated VSIX packages
        uses: actions/upload-artifact@v7
        with:
          name: vsix-${{ github.sha }}
          path: |
            artifacts/release/GraphiteTheme-*.vsix
            artifacts/release/FocusThemes-*.vsix
            artifacts/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
